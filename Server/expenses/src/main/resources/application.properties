server.port=8390
spring.application.name=expenses

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/JVDB_Expenses?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Feign
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
feign.client.config.venues.loggerLevel=full

# Resilience4J
resilience4j.circuitbreaker.instances.venues.slidingWindowSize=10
resilience4j.circuitbreaker.instances.venues.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.venues.failureRateThreshold=50
resilience4j.circuitbreaker.instances.venues.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.venues.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.venues.recordExceptions=feign.FeignException,java.io.IOException,java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.venues.ignoreExceptions=com.juntas.event.exception.InvalidScheduleException,com.juntas.event.exception.VenueAlreadyBookedException,com.juntas.event.exception.VenueNotFoundException,com.juntas.event.exception.EventNotFoundException

# Logging
logging.level.com.juntas.event.client.VenueClient=DEBUG
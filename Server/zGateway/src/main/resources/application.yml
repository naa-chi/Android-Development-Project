server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
          #  - id: users
          #    uri: lb://users
          #    predicates:
          #      - Path=/api/v1/users/**,/api/v1/auth/**

            - id: neighborhoods
              uri: lb://neighborhoods
              predicates:
                - Path=/api/v1/neighborhoods/**

            - id: venues
              uri: lb://venues
              predicates:
                - Path=/api/v1/venues/**

          #  - id: events
          #    uri: lb://events
          #    predicates:
          #      - Path=/api/v1/events/**

          #  - id: costs
          #    uri: lb://costs
          #    predicates:
          #      - Path=/api/v1/costs/**,/api/v1/utility-bills/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
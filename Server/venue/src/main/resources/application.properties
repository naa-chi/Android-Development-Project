
server.port=8386

spring.application.name=venues

spring.datasource.url=jdbc:mysql://localhost:3306/JVDB_Venue?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic
feign.client.config.neighborhoods.loggerLevel=full

resilience4j.circuitbreaker.instances.neighborhoods.slidingWindowSize=10
resilience4j.circuitbreaker.instances.neighborhoods.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.neighborhoods.failureRateThreshold=50
resilience4j.circuitbreaker.instances.neighborhoods.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.neighborhoods.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.neighborhoods.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.neighborhoods.recordExceptions=feign.FeignException,java.io.IOException,java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.neighborhoods.ignoreExceptions=com.juntas.venue.exception.NeighborhoodNotFoundException

logging.level.com.juntas.venue.client.NeighborhoodClient=DEBUG